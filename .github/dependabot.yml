# Dependency updates (docs/21 section 5): one grouped pull request per ecosystem each week, so advisories
# like the ones found in the security audit reach the repository without anyone remembering to look.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /apps/ai
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web, /apps/ai]
    schedule:
      interval: monthly
    labels: [dependencies]
