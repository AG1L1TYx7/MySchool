name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API on ${{ matrix.db.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: mariadb-10.4
            image: mariadb:10.4
            env: MARIADB_ROOT_PASSWORD
            coverage: true
          - name: mysql-8
            image: mysql:8.0
            env: MYSQL_ROOT_PASSWORD
            coverage: false
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
          MARIADB_DATABASE: smartschooldb_test
          MYSQL_DATABASE: smartschooldb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/smartschooldb_test
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-0123456789
      AI_CALLBACK_TOKEN: ci-only-callback-token-0123456789
      WEB_APP_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartschool/api prisma:generate
      - run: pnpm --filter @smartschool/api lint
      - run: pnpm --filter @smartschool/api typecheck
      - run: pnpm --filter @smartschool/api prisma:deploy
      - name: Migration drift check (the migrations must produce exactly the schema)
        run: pnpm --filter @smartschool/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: pnpm --filter @smartschool/api test
      - run: pnpm --filter @smartschool/api db:seed
      - name: End-to-end tests (failures are copied to the job summary)
        run: |
          status=0
          coverage=""
          if [ "${{ matrix.db.coverage }}" = "true" ]; then coverage="--coverage"; fi
          pnpm --filter @smartschool/api test:e2e --runInBand --forceExit $coverage > e2e.log 2>&1 || status=$?
          grep -aA5 'Coverage summary' e2e.log || true
          grep -avE '^\{"level"' e2e.log | tail -150
          {
            echo '## End-to-end'
            grep -aE '^Tests:|^Test Suites:' e2e.log
            echo
            echo '```'
            grep -a -A 25 -E '● .* ›|● Test suite' e2e.log | grep -avE '^\s+at ' | head -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations are readable without repository rights, but GitHub keeps at most ten per step:
          # the first unhandled server errors (the cause behind a 500) come first, then the failing test names.
          if [ "$status" -ne 0 ]; then
            grep -a -A 8 'Unhandled error' e2e.log | grep -avE '^--$|^[[:space:]]*$' | cut -c1-400 | head -6 | while IFS= read -r line; do echo "::error title=server::${line}"; done
            grep -a -E '● .* ›|● Test suite' e2e.log | head -4 | while IFS= read -r line; do echo "::error title=e2e::${line}"; done
          fi
          exit $status
      - run: pnpm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/secrets/secret-rules.test.mjs
      - name: "Every tracked file against the credential patterns (tools/secrets/secret-rules.mjs)"
        run: node tools/secrets/scan.mjs

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartschool/web lint
      - run: pnpm --filter @smartschool/web typecheck
      - run: pnpm --filter @smartschool/web build

  ai:
    name: AI service
    runs-on: ubuntu-latest
    env:
      MODEL_PROVIDER: fake
      AI_SERVICE_TOKEN: ci-only-ai-service-token-0123456789
      LMS_SERVICE_TOKEN: ci-only-callback-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai/pyproject.toml
      - run: pip install -e "apps/ai[dev]"
      - run: ruff check apps/ai
      - run: ruff format --check apps/ai
      - run: mypy app
        working-directory: apps/ai
      - run: pytest apps/ai -q
      - run: pip install pip-audit && pip-audit --skip-editable

  browser:
    name: Browser ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [sweep, a11y, lighthouse, zap]
    services:
      db:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: smartschooldb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/smartschooldb
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-0123456789
      AI_CALLBACK_TOKEN: ci-only-callback-token-0123456789
      AI_SERVICE_URL: http://127.0.0.1:8000
      AI_SERVICE_API_KEY: ci-only-ai-service-token-0123456789
      WEB_APP_URL: http://localhost:3000
      API_URL: http://127.0.0.1:5000
      RATE_LIMIT_PER_MINUTE: '100000'
      LOGIN_RATE_LIMIT_PER_MINUTE: '1000'
      MODEL_PROVIDER: fake
      AI_SERVICE_TOKEN: ci-only-ai-service-token-0123456789
      LMS_SERVICE_TOKEN: ci-only-callback-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - run: pip install -e "apps/ai[dev]"
      - run: pnpm browser:rules
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @smartschool/api prisma:generate
      - run: pnpm --filter @smartschool/api build
      - run: pnpm --filter @smartschool/api prisma:deploy
      - run: pnpm --filter @smartschool/api db:seed
      - run: pnpm --filter @smartschool/web build
      - name: Start the API, the web app and the AI service
        run: |
          (cd apps/api && NODE_ENV=test node dist/main > ../../api.log 2>&1 &)
          (cd apps/web && pnpm start > ../../web.log 2>&1 &)
          (cd apps/ai && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../../ai.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5000/api/v1/health >/dev/null && curl -sf http://localhost:3000/login >/dev/null && curl -sf http://127.0.0.1:8000/health >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:5000/api/v1/health && curl -sf -o /dev/null http://localhost:3000/login && curl -sf http://127.0.0.1:8000/health
      - name: "Run the check (sweep: every page as every role; a11y: WCAG 2.2 AA with axe-core, six roles; lighthouse: the budget on the public pages; zap: OWASP ZAP passive scan of the web app and the API)"
        run: pnpm browser:${{ matrix.check }} ci-${{ matrix.check }}
      - name: Logs on failure
        if: failure()
        run: |
          for f in api.log web.log ai.log; do echo "== $f"; tail -60 "$f" || true; done
          echo '## API log (tail)' >> "$GITHUB_STEP_SUMMARY"; tail -80 api.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '## Web log (tail)' >> "$GITHUB_STEP_SUMMARY"; tail -40 web.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '## AI log (tail)' >> "$GITHUB_STEP_SUMMARY"; tail -40 ai.log >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.check }}
          path: |
            tools/browser/out/
            tools/zap/out/
          if-no-files-found: ignore
