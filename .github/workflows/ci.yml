name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API on ${{ matrix.db.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: mariadb-10.4
            image: mariadb:10.4
            env: MARIADB_ROOT_PASSWORD
          - name: mysql-8
            image: mysql:8.0
            env: MYSQL_ROOT_PASSWORD
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
          MARIADB_DATABASE: smartschooldb_test
          MYSQL_DATABASE: smartschooldb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/smartschooldb_test
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-0123456789
      AI_CALLBACK_TOKEN: ci-only-callback-token-0123456789
      WEB_APP_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartschool/api prisma:generate
      - run: pnpm --filter @smartschool/api lint
      - run: pnpm --filter @smartschool/api typecheck
      - run: pnpm --filter @smartschool/api prisma:deploy
      - run: pnpm --filter @smartschool/api test
      - run: pnpm --filter @smartschool/api db:seed
      - name: End-to-end tests (failures are copied to the job summary)
        run: |
          status=0
          pnpm --filter @smartschool/api test:e2e --runInBand --forceExit > e2e.log 2>&1 || status=$?
          grep -avE '^\{"level"' e2e.log | tail -150
          {
            echo '## End-to-end'
            grep -aE '^Tests:|^Test Suites:' e2e.log
            echo
            echo '```'
            grep -a -A 25 -E '● .* ›|● Test suite' e2e.log | grep -avE '^\s+at ' | head -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Failing tests also become run annotations, which are readable without repository rights.
          if [ "$status" -ne 0 ]; then
            grep -a -A 12 -E '● .* ›|● Test suite' e2e.log | grep -avE '^[[:space:]]+at |^--$|^[[:space:]]*$' | head -60 | while IFS= read -r line; do echo "::error title=e2e::${line}"; done
          fi
          exit $status
      - run: pnpm audit --audit-level=high

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartschool/web lint
      - run: pnpm --filter @smartschool/web typecheck
      - run: pnpm --filter @smartschool/web build

  ai:
    name: AI service
    runs-on: ubuntu-latest
    env:
      MODEL_PROVIDER: fake
      AI_SERVICE_TOKEN: ci-only-ai-service-token-0123456789
      LMS_SERVICE_TOKEN: ci-only-callback-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai/pyproject.toml
      - run: pip install -e "apps/ai[dev]"
      - run: ruff check apps/ai
      - run: ruff format --check apps/ai
      - run: mypy app
        working-directory: apps/ai
      - run: pytest apps/ai -q
      - run: pip install pip-audit && pip-audit --skip-editable
 | head -60 | while IFS= read -r line; do echo "::error title=e2e::${line}"; done
          fi
          exit $status
      - run: pnpm audit --audit-level=high

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartschool/web lint
      - run: pnpm --filter @smartschool/web typecheck
      - run: pnpm --filter @smartschool/web build

  ai:
    name: AI service
    runs-on: ubuntu-latest
    env:
      MODEL_PROVIDER: fake
      AI_SERVICE_TOKEN: ci-only-ai-service-token-0123456789
      LMS_SERVICE_TOKEN: ci-only-callback-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ai/pyproject.toml
      - run: pip install -e "apps/ai[dev]"
      - run: ruff check apps/ai
      - run: ruff format --check apps/ai
      - run: mypy app
        working-directory: apps/ai
      - run: pytest apps/ai -q
      - run: pip install pip-audit && pip-audit --skip-editable
